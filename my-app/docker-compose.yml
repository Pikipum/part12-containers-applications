services:
  backend:
    build:
      context: ./bloglist-backend
      dockerfile: Dockerfile
    env_file:
      - ./bloglist-backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      - mongo

  frontend:
    build:
      context: ./bloglist-frontend
      dockerfile: Dockerfile
    depends_on:
      - backend

  mongo:
    image: mongo
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data: