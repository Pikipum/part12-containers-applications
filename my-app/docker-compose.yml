services:
  backend:
    build:
      context: ./bloglist-backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI}
      SECRET: ${SECRET}
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./bloglist-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  mongo_data: